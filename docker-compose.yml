name: ai-english-hub

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

x-java-service: &java-service
  build:
    context: .
  restart: unless-stopped
  logging: *default-logging
  environment: &java-env
    JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-to-a-long-random-secret-key-32b+}
    JWT_ISSUER: ${JWT_ISSUER:-ai-english-hub}
    LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-WARN}
    LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: WARN
    LOGGING_LEVEL_ORG_APACHE_KAFKA: ERROR
    LOGGING_LEVEL_ORG_HIBERNATE: WARN
  networks:
    - hub

services:
  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-englishhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-englishhub}
      POSTGRES_DB: ${POSTGRES_DB:-englishhub}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-englishhub}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [hub]

  redis:
    image: redis:7-alpine
    logging: *default-logging
    command: ["redis-server", "--save", "", "--appendonly", "no", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [hub]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    logging: *default-logging
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_LOG4J_ROOT_LOGLEVEL: WARN
      ZOOKEEPER_TOOLS_LOG4J_LOGLEVEL: ERROR
    networks: [hub]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    logging: *default-logging
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_LOG4J_LOGGERS: kafka=WARN,kafka.controller=WARN,kafka.log.LogCleaner=ERROR,state.change.logger=WARN,kafka.producer.async.DefaultEventHandler=ERROR,kafka.network.Processor=ERROR,kafka.request.logger=ERROR,kafka.server=WARN
      KAFKA_TOOLS_LOG4J_LOGLEVEL: ERROR
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks: [hub]

  qdrant:
    image: qdrant/qdrant:v1.13.2
    logging: *default-logging
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [hub]

  minio:
    image: minio/minio:latest
    logging: *default-logging
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks: [hub]

  ollama:
    image: ollama/ollama:latest
    logging: *default-logging
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 8
      start_period: 20s
    networks: [hub]

  # Pull models via Ollama HTTP API (avoids fragile `docker compose exec`)
  ollama-init:
    image: curlimages/curl:8.12.1
    logging: *default-logging
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Waiting for Ollama API..."
        until curl -sf http://ollama:11434/api/tags >/dev/null; do sleep 2; done
        echo "Pulling llama3.2..."
        curl -sf -X POST http://ollama:11434/api/pull -d '{"name":"llama3.2","stream":false}'
        echo "Pulling llama3.2:1b (fast quiz optional path)..."
        curl -sf -X POST http://ollama:11434/api/pull -d '{"name":"llama3.2:1b","stream":false}'
        echo "Pulling nomic-embed-text..."
        curl -sf -X POST http://ollama:11434/api/pull -d '{"name":"nomic-embed-text","stream":false}'
        echo "Ollama models ready."
    networks: [hub]

  identity-service:
    <<: *java-service
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/identity_db?characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-englishhub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-englishhub}
      SPRING_DATA_REDIS_HOST: redis
      SERVER_PORT: 8081
    expose:
      - "8081"

  classroom-service:
    <<: *java-service
    build:
      context: .
      dockerfile: services/classroom-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/classroom_db?characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-englishhub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-englishhub}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8082
    expose:
      - "8082"

  content-service:
    <<: *java-service
    build:
      context: .
      dockerfile: services/content-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/content_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-englishhub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-englishhub}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8083
    expose:
      - "8083"

  assessment-service:
    <<: *java-service
    build:
      context: .
      dockerfile: services/assessment-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      classroom-service:
        condition: service_started
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/assessment_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-englishhub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-englishhub}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8084
      CLASSROOM_SERVICE_URL: http://classroom-service:8082
    expose:
      - "8084"

  ai-orchestration:
    build:
      context: ./ai/orchestration
    restart: unless-stopped
    logging: *default-logging
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_QUIZ_MODEL: ${OLLAMA_QUIZ_MODEL:-llama3.2:1b}
      OLLAMA_TUTOR_MODEL: ${OLLAMA_TUTOR_MODEL:-llama3.2:1b}
      TUTOR_OLLAMA_TIMEOUT: ${TUTOR_OLLAMA_TIMEOUT:-8}
      TUTOR_RAG_TIMEOUT: ${TUTOR_RAG_TIMEOUT:-2.0}
      TUTOR_STT_TIMEOUT: ${TUTOR_STT_TIMEOUT:-8}
      TUTOR_VISION_TIMEOUT: ${TUTOR_VISION_TIMEOUT:-35}
      # Default: heuristic banks (<1s). Set false to try OLLAMA_QUIZ_MODEL with tight timeout.
      QUIZ_PREFER_HEURISTIC: ${QUIZ_PREFER_HEURISTIC:-true}
      QUIZ_OLLAMA_TIMEOUT: ${QUIZ_OLLAMA_TIMEOUT:-0.8}
      RAG_URL: http://ai-rag:8091
      MULTIMODAL_URL: http://ai-multimodal:8092
      CONTENT_URL: http://content-service:8083
      CLASSROOM_URL: http://classroom-service:8082
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-to-a-long-random-secret-key-32b+}
      OPENAPI_SERVER_URL: http://localhost:8080
    expose:
      - "8090"
    depends_on: [ollama, ai-rag, ai-multimodal, content-service, classroom-service]
    networks: [hub]

  ai-rag:
    build:
      context: ./ai/rag
    restart: unless-stopped
    logging: *default-logging
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      COLLECTION_NAME: lesson_chunks
    expose:
      - "8091"
    depends_on: [qdrant, ollama]
    networks: [hub]

  ai-multimodal:
    build:
      context: ./ai/multimodal
    restart: unless-stopped
    logging: *default-logging
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llava}
      OLLAMA_IMAGE_MODEL: ${OLLAMA_IMAGE_MODEL:-}
      OLLAMA_STT_MODEL: ${OLLAMA_STT_MODEL:-}
      # Heuristic path is fast when model missing; allow time when llava is pulled.
      VISION_TIMEOUT: ${VISION_TIMEOUT:-45}
      STT_TIMEOUT: ${STT_TIMEOUT:-8}
      OPENAPI_SERVER_URL: http://localhost:8092
    expose:
      - "8092"
    depends_on: [ollama]
    networks: [hub]

  notification-service:
    <<: *java-service
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-englishhub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-englishhub}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENAPI_SERVER_URL: http://localhost:8080
      SERVER_PORT: 8085
    expose:
      - "8085"
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8085/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 18
      start_period: 45s

  gateway:
    <<: *java-service
    build:
      context: .
      dockerfile: gateway/Dockerfile
    depends_on:
      identity-service:
        condition: service_started
      classroom-service:
        condition: service_started
      content-service:
        condition: service_started
      assessment-service:
        condition: service_started
      notification-service:
        condition: service_healthy
      ai-orchestration:
        condition: service_started
      ai-rag:
        condition: service_started
      ai-multimodal:
        condition: service_started
    environment:
      <<: *java-env
      IDENTITY_URI: http://identity-service:8081
      CLASSROOM_URI: http://classroom-service:8082
      CONTENT_URI: http://content-service:8083
      ASSESSMENT_URI: http://assessment-service:8084
      NOTIFICATION_URI: http://notification-service:8085
      AI_ORCHESTRATION_URI: http://ai-orchestration:8090
      AI_RAG_URI: http://ai-rag:8091
      AI_MULTIMODAL_URI: http://ai-multimodal:8092
      OPENAPI_SERVER_URL: http://localhost:8080
      SERVER_PORT: 8080
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY: WARN
    ports:
      - "8080:8080"

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    logging: *default-logging
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on: [gateway]
    networks: [hub]

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  ollama_data:

networks:
  hub:
    driver: bridge
